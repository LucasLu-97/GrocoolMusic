name: release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '测试版版本号（例如 0.1.0）'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build signed test release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Resolve version and tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v${INPUT_VERSION}-build.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grocool-release.p12"
          ls -lh "$RUNNER_TEMP/grocool-release.p12"

      - name: Assemble signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/grocool-release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${{ steps.ver.outputs.name }}"

      - name: Verify APK is signed
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/GrocoolMusic-${{ steps.ver.outputs.name }}-release.apk"
          ls -lh dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Grocool Music 测试版 ${{ steps.ver.outputs.name }}
          prerelease: true
          files: dist/*.apk
          body: |
            Grocool Music 测试版（M0 构建管线验证版）。

            - 由 GitHub Actions 编译，使用全项目统一签名密钥签名
            - versionCode: ${{ github.run_number }}
            - 当前仅包含酷狗协议层与最小启动界面，尚不含音乐播放功能
            - 与后续版本同签名、同 applicationId，可直接覆盖安装
            - 仅供学习与技术验证，请勿用于商业用途

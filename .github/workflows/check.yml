name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kugou-protocol:
    name: kugou protocol layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Compile protocol layer and Android skeleton
        run: gradle :kugou:compileKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Run signature golden tests
        run: gradle :kugou:test --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kugou-test-report
          path: kugou/build/reports/tests/test
          if-no-files-found: ignore
